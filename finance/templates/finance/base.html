<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}BizLive Finance{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root {
            --bg: #f5f7fb;
            --text: #172033;
            --muted: #687386;
            --line: rgba(23,32,51,.10);
            --blue: #2363ff;
            --purple: #7c3aed;
            --green: #0daa6e;
            --red: #e04444;
            --orange: #f59e0b;
            --card: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: var(--text);
            background: var(--bg);
        }

        .app {
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: white;
            border-right: 1px solid var(--line);
            padding: 22px 18px;
            min-height: 100vh;
            position: sticky;
            top: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 25px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 15px;
            display: grid;
            place-items: center;
            color: white;
            background: linear-gradient(135deg, var(--blue), var(--purple));
        }

        .nav-item {
            display: block;
            text-decoration: none;
            color: var(--muted);
            font-weight: 800;
            padding: 13px 15px;
            border-radius: 15px;
            margin-bottom: 8px;
        }

        .nav-item:hover,
        .nav-item.active {
            color: var(--blue);
            background: rgba(35, 99, 255, 0.10);
        }

        .main { padding: 26px; }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .top h1 { margin: 0; font-size: 34px; }
        .top p { margin: 8px 0 0; color: var(--muted); }

        .btn {
            display: inline-block;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-weight: 800;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 15px;
        }

        .btn-primary { color: white; background: linear-gradient(135deg, var(--blue), var(--purple)); }
        .btn-soft { color: var(--text); background: white; border: 1px solid var(--line); }

        .hero {
            color: white;
            padding: 26px;
            border-radius: 28px;
            background: linear-gradient(135deg, #10182d, #2363ff, #7c3aed);
            margin-bottom: 16px;
        }

        .hero h2 { font-size: 44px; margin: 10px 0 18px; }

        .hero-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .hero-mini {
            padding: 14px;
            border-radius: 18px;
            background: rgba(255,255,255,.14);
            border: 1px solid rgba(255,255,255,.18);
        }

        .hero-mini span { color: rgba(255,255,255,.75); font-size: 13px; }
        .hero-mini b { display: block; margin-top: 8px; font-size: 18px; }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 16px;
        }

        .card, .panel {
            background: var(--card);
            border: 1px solid rgba(255,255,255,.8);
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(23,32,51,.08);
        }

        .card { padding: 18px; }
        .card small { color: var(--muted); font-weight: 800; }
        .card strong { display: block; font-size: 25px; margin-top: 9px; }

        .grid {
            display: grid;
            grid-template-columns: 1.35fr .65fr;
            gap: 16px;
        }

        .panel { padding: 18px; overflow-x: auto; }
        .panel h2 { margin: 0 0 15px; }

        table { width: 100%; border-collapse: collapse; min-width: 820px; }
        th { text-align: left; color: var(--muted); font-size: 13px; padding: 13px 11px; }
        td { padding: 14px 11px; border-top: 1px solid var(--line); vertical-align: top; }

        .pill {
            display: inline-block;
            padding: 7px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 900;
        }

        .income, .paid { color: var(--green); background: rgba(13,170,110,.11); }
        .expense, .failed { color: var(--red); background: rgba(224,68,68,.10); }
        .pending, .started, .overdue { color: var(--orange); background: rgba(245,158,11,.13); }
        .method { color: var(--blue); background: rgba(35,99,255,.10); }

        .action-link { color: var(--blue); text-decoration: none; font-weight: 900; }
        .delete { color: var(--red); text-decoration: none; font-weight: 900; }

        input, select, textarea {
            width: 100%;
            border: 1px solid #e5e7eb;
            background: white;
            border-radius: 16px;
            padding: 14px 16px;
            outline: none;
            font: inherit;
            color: #111827;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(35,99,255,.12);
        }

        label { font-weight: 800; color: var(--muted); font-size: 14px; }

        .score {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: conic-gradient(var(--blue) 100%, var(--blue) 0);
            margin: 14px auto;
        }

        .score div {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            background: white;
            display: grid;
            place-items: center;
            font-size: 30px;
            font-weight: 900;
        }

        .action-card {
            background: white;
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 14px;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .live-dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            background: var(--green);
            border-radius: 50%;
            margin-right: 8px;
        }

        @media (max-width: 900px) {
            .app { grid-template-columns: 1fr; }
            .sidebar { min-height: auto; position: relative; }
            .cards, .grid, .hero-grid { grid-template-columns: 1fr; }
            .top { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand"><div class="brand-icon">₹</div>BizLive</div>
            <a class="nav-item {% if page == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">🏠 Dashboard</a>
            <a class="nav-item {% if page == 'transactions' %}active{% endif %}" href="{% url 'transactions' %}">💳 Transactions</a>
            <a class="nav-item {% if page == 'payments' %}active{% endif %}" href="{% url 'payments' %}">⚡ Payments</a>
            <a class="nav-item {% if page == 'upi' %}active{% endif %}" href="{% url 'upi_page' %}">📲 UPI</a>
            <a class="nav-item {% if page == 'alerts' %}active{% endif %}" href="{% url 'alerts' %}">🚨 Alerts</a>
            <a class="nav-item {% if page == 'reports' %}active{% endif %}" href="{% url 'reports' %}">📊 Reports</a>
            <a class="nav-item {% if page == 'add' %}active{% endif %}" href="{% url 'add_transaction' %}">➕ Add Record</a>
            <a class="nav-item" href="{% url 'export_csv' %}">⬇️ Export CSV</a>
        </aside>

        <main class="main">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        function rupee(value) {
            return "₹" + Number(value || 0).toLocaleString("en-IN");
        }

        async function updateLiveStats() {
            if (!document.getElementById("live-balance")) return;
            try {
                const res = await fetch("{% url 'api_stats' %}");
                const data = await res.json();
                const fields = {
                    "live-balance": data.balance,
                    "live-income": data.income,
                    "live-expense": data.expense,
                    "live-pending-income": data.pending_income,
                    "live-pending-expense": data.pending_expense,
                    "live-upi-total": data.upi_total,
                    "live-razorpay-total": data.razorpay_total,
                    "live-today-net": data.today_net,
                    "live-overdue": data.overdue_amount,
                    "live-safe": data.safe_to_spend
                };
                for (const id in fields) {
                    const el = document.getElementById(id);
                    if (el) el.innerText = rupee(fields[id]);
                }
                const score = document.getElementById("live-score");
                if (score) score.innerText = data.score;
                const status = document.getElementById("live-status");
                if (status) status.innerText = data.decision_status;
                const time = document.getElementById("live-time");
                if (time) time.innerText = new Date().toLocaleTimeString();
            } catch (error) {
                console.log("Live update failed", error);
            }
        }
        setInterval(updateLiveStats, 7000);
        updateLiveStats();
    </script>
</body>
</html>
